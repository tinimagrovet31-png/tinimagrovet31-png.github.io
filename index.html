<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tinim Agrovet | Trusted Livestock Nutrition</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f4f6f2;color:#222;line-height:1.6}
a{text-decoration:none}.top{background:linear-gradient(135deg,#03351d,#08713b);color:#fff;text-align:center;padding:28px 12px;border-bottom:4px solid #d7a52b}
.brandlogo{width:145px;height:145px;object-fit:cover;border-radius:50%;border:4px solid #d7a52b;display:block;margin:0 auto 8px;box-shadow:0 5px 18px #0005}.brandname{font:800 42px Georgia,serif;color:#ffd45a}.tag{font-size:18px;color:#fff2b5}nav{position:sticky;top:0;z-index:9;background:#064b29;display:flex;overflow:auto;padding:9px}nav a{color:#fff;white-space:nowrap;padding:8px 14px;margin:0 3px;border:1px solid #72b88d;border-radius:22px}
.hero{text-align:center;background:#fff;padding:28px 15px}.hero h1{color:#075b31;font-size:clamp(28px,6vw,46px);margin:0}
.services{max-width:1100px;margin:15px auto;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 15px}.service{background:#fff;padding:14px;text-align:center;border-radius:14px;border:1px solid #dfd09a}.service b{display:block;color:#075b31}
.wrap{max-width:1100px;margin:auto;padding:15px}.product{background:#fff;margin:28px 0;border-radius:20px;overflow:hidden;box-shadow:0 7px 24px #0002}.head{padding:18px 20px;background:linear-gradient(90deg,#111,#920000);color:#fff}.greenhead{background:linear-gradient(90deg,#064b29,#138c48)}.head h2{margin:0;color:#ffd66a;font-size:clamp(25px,5vw,38px)}.grid{display:grid;grid-template-columns:minmax(250px,390px) 1fr;gap:22px;padding:20px}.prod{width:100%;height:auto;max-height:650px;object-fit:contain;border-radius:14px}
.box{background:#fff9e9;border:1px solid #e2c979;border-radius:15px;padding:17px;margin-bottom:15px}h3{color:#075b31;margin-top:0}li{margin:7px 0}
.badge{display:inline-block;background:#f1df9b;padding:4px 9px;border-radius:18px;margin:3px;font-size:12px}button{border:0;background:#08763e;color:#fff;padding:9px 14px;border-radius:20px;font-weight:bold}.more{display:none}.more.show{display:block}
.buttons{display:flex;flex-wrap:wrap;gap:9px}.btn{color:#fff;padding:10px 15px;border-radius:25px;font-weight:bold}.red{background:#b00000}.blue{background:#087fe8}.wa{background:#18a957}.gold{background:#a97700}
.contact{background:#063d22;color:#fff;padding:35px 15px;border-top:4px solid #d7a52b}.contactgrid{max-width:1100px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:25px}.contact h2{color:#ffd45a}footer{background:#031b0e;color:#bbb;text-align:center;padding:15px}
@media(max-width:800px){.services{grid-template-columns:1fr 1fr}.grid,.contactgrid{grid-template-columns:1fr}}@media(max-width:450px){.services{grid-template-columns:1fr}.brandname{font-size:34px}.brandlogo{width:120px;height:120px}}

.package-section{max-width:1100px;margin:28px auto;padding:0 15px}
.package-title{background:linear-gradient(90deg,#064b29,#b00000);color:#fff;padding:20px;border-radius:18px 18px 0 0;text-align:center}
.package-title h2{margin:0;color:#ffd66a;font-size:clamp(27px,5vw,40px)}
.package-title p{margin:5px 0 0;font-size:17px}
.package-intro{background:#fff;padding:22px;border:1px solid #dfd09a;border-top:0}
.claim{background:linear-gradient(135deg,#fff8df,#fff);border-left:6px solid #b00000;padding:16px;border-radius:12px;margin-bottom:18px}
.claim strong{color:#b00000;font-size:clamp(20px,4vw,30px)}
.package-images{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0}
.package-images figure{margin:0;background:#f7f7f7;border-radius:16px;padding:10px;border:1px solid #ddd;box-shadow:0 5px 18px #0001}
.package-images img{width:100%;height:auto;display:block;border-radius:12px}
.package-images figcaption{text-align:center;font-weight:bold;color:#075b31;padding:8px 4px 2px}
.feature-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin:20px 0}
.feature-card{background:#fff9e9;border:1px solid #e2c979;border-radius:15px;padding:16px}
.feature-card h3{margin:0 0 8px}
.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:15px}
.price-card{background:#fff;border:2px solid #138c48;border-radius:16px;padding:17px;box-shadow:0 5px 16px #0001}
.price-card h3{margin:0 0 5px;color:#064b29}
.price{font-size:25px;font-weight:800;color:#b00000}
.free{color:#08763e;font-weight:700}
.offer{background:linear-gradient(135deg,#fff4bf,#fff);border:2px dashed #d7a52b;border-radius:16px;padding:18px;margin:20px 0}
.offer h3{color:#9a6500}
.selector{background:#063d22;color:#fff;border-radius:16px;padding:20px;margin-top:20px}
.selector h3{color:#ffd45a}
.selector-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.selector-box{background:#fff;color:#222;border-radius:14px;padding:15px}
.selector-box h4{color:#075b31;margin-top:0;font-size:20px}
.selector-box p{margin:8px 0;padding:9px;background:#f4f6f2;border-radius:9px}
.note{font-size:13px;color:#666;margin-top:10px}
@media(max-width:800px){
  .price-grid{grid-template-columns:1fr}
  .package-images,.feature-grid,.selector-grid{grid-template-columns:1fr}
}

.hero{padding:34px 15px 28px;background:linear-gradient(180deg,#fff,#f5fbf6);border-bottom:1px solid #e1d29a}
.hero-badge{display:inline-block;background:#075b31;color:#ffd66a;font-weight:800;padding:7px 14px;border-radius:30px;font-size:13px;letter-spacing:.3px}
.hero h1{max-width:1000px;margin:14px auto 2px;color:#b00000;font-size:clamp(30px,6vw,52px);line-height:1.2;font-weight:900}
.hero-sub{font-size:clamp(20px,4vw,30px);font-weight:800;color:#d47b00;margin-bottom:12px}
.hero-lead{max-width:900px;margin:0 auto 15px;font-size:clamp(17px,2.5vw,21px)}
.hero-highlight{max-width:950px;margin:0 auto 18px;background:#fff;border:2px solid #e2c979;border-left:7px solid #08763e;border-radius:16px;padding:17px 20px;text-align:left;box-shadow:0 5px 18px #0001}
.hero-highlight>b{font-size:24px;color:#075b31}
.hero-highlight p{margin:7px 0 0;font-size:17px}
.hero-delivery,.hero-cod{display:inline-block;margin:5px;padding:11px 18px;border-radius:28px;font-weight:900;font-size:17px}
.hero-delivery{background:#08763e;color:#fff}
.hero-cod{background:#b00000;color:#fff}

/* New styles for weight labels and combined images */
.weight-labels {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 10px;
  font-weight: bold;
  color: #075b31;
  font-size: 18px;
}
.combined-images {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}
.combined-images img {
  width: 50%;
  border-radius: 12px;
  border: 1px solid #ddd;
}
</style>
